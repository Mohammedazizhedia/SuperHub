name: Build Android (Signed)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # الخطوة دي بتزود رقم النسخة أوتوماتيك
      - name: Auto Increment Version
        run: |
          # قراءة رقم النسخة الحالي
          CURRENT_CODE=$(grep "superhub.versionCode=" gradle.properties | cut -d'=' -f2)
          NEW_CODE=$((CURRENT_CODE + 1))
          
          # تحديث الملف بالرقم الجديد
          sed -i "s/superhub.versionCode=$CURRENT_CODE/superhub.versionCode=$NEW_CODE/" gradle.properties
          
          # عمل Commit للرقم الجديد عشان ميتلخبطش تاني
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add gradle.properties
          git commit -m "chore: bump version to $NEW_CODE [skip ci]" || true
          git push || true
          
          echo "✅ Version bumped to $NEW_CODE"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > androidApp/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Rename APK with Version
        run: |
          VERSION_NAME=$(grep "superhub.versionName=" gradle.properties | cut -d'=' -f2)
          VERSION_CODE=$(grep "superhub.versionCode=" gradle.properties | cut -d'=' -f2)
          mv androidApp/build/outputs/apk/release/*.apk "androidApp/build/outputs/apk/release/SuperHub_v${VERSION_NAME}_Build${VERSION_CODE}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperHub-APK
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 14
