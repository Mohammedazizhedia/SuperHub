name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.jks \
            -alias superhub_key -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "SuperHubPassword123!" -keypass "SuperHubPassword123!" \
            -dname "CN=SuperHub, OU=BFB.AI, O=BFB.AI, L=Cairo, ST=Cairo, C=EG"
          
          # Convert to base64
          base64 -w 0 release.jks > keystore_base64.txt
          
          echo "=== KEYSTORE BASE64 (COPY THIS) ==="
          cat keystore_base64.txt
          echo "==================================="

      - name: Upload Keystore as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: superhub-keystore
          path: release.jks
          retention-days: 1
