name: Run Scaffold Script

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Find and Execute Scripts Dynamically
        run: |
          # البحث عن كل الملفات اللي بتبدأ بـ part وبتنتهي بـ sh وترتيبها أبجدياً
          SCRIPTS=$(find scripts -type f -name "part*.sh" | sort)
          
          if [ -z "$SCRIPTS" ]; then
            echo "⚠️ No scripts found to execute."
            exit 0
          fi
          
          for script in $SCRIPTS; do
            echo "======================================"
            echo "▶️ Executing: $script"
            echo "======================================"
            chmod +x "$script"
            bash "$script"
          done
          echo "✅ All scripts executed successfully."

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          # التأكد إن فيه تغييرات قبل الـ commit عشان ميعملش Error
          if ! git diff --staged --quiet; then
            git commit -m "Auto-scaffold: Dynamic build — Built with BFB.AI"
            git push
          else
            echo "No changes to commit."
          fi
