name: Run Scaffold Script

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Find and Execute Scripts Dynamically
        run: |
          # تشغيل السكريبت رقم 10 الأول عشان يثبت التوقيع، وبعدين رقم 11
          for script in scripts/part10.sh scripts/part11.sh; do
            if [ -f "$script" ]; then
              echo "======================================"
              echo "▶️ Executing: $script"
              echo "======================================"
              chmod +x "$script"
              bash "$script"
            fi
          done
          echo "✅ All targeted scripts executed successfully."

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-scaffold: Part 11 (UI & Sync) — Built with BFB.AI"
            # سحب التحديثات الأخيرة قبل الرفع عشان نتجنب التعارض
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
