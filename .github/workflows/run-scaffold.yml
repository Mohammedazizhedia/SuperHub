name: Run Scaffold Script

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Find and Execute Scripts Dynamically
        run: |
          # 1. تشغيل كل السكريبتات اللي في الفولدر بالترتيب
          for script in $(find scripts -type f -name "*.sh" | sort); do
            if [ -f "$script" ]; then
              echo "======================================"
              echo "▶️ Executing: $script"
              echo "======================================"
              chmod +x "$script"
              bash "$script"
            fi
          done
          
          # 2. تشغيل سكريبت التوقيع (10) كآخر خطوة عشان يضمن إن التوقيع سليم
          if [ -f "scripts/part10.sh" ]; then
            echo "======================================"
            echo "▶️ Locking Signing Configuration (part10.sh)"
            echo "======================================"
            chmod +x scripts/part10.sh
            bash scripts/part10.sh
          fi
          echo "✅ All scripts executed successfully."

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto-scaffold: Full Build — Built with BFB.AI"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi
